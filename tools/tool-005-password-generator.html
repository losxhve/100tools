<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>密码生成器 - 100 Tools</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; }
.container { max-width:720px; margin:0 auto; padding:24px 20px; flex:1; width:100%; }
.header { text-align:center; margin-bottom:24px; }
.header h1 { font-size:24px; background:linear-gradient(135deg,#f59e0b,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
.header .sub { color:#64748b; font-size:13px; }
.card { background:#1e293b; border-radius:12px; padding:24px; border:1px solid #334155; margin-bottom:16px; }
label { display:block; font-size:13px; color:#94a3b8; margin-bottom:6px; font-weight:600; }
textarea, input, select { width:100%; padding:10px 14px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:14px; font-family:monospace; outline:none; margin-bottom:12px; }
textarea:focus, input:focus, select:focus { border-color:#3b82f6; }
textarea { min-height:120px; resize:vertical; }
button { padding:10px 24px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; background:#3b82f6; color:white; transition:background .15s; margin-right:8px; margin-bottom:8px; }
button:hover { background:#2563eb; }
button.secondary { background:#334155; color:#e2e8f0; }
button.secondary:hover { background:#475569; }
button.success { background:#22c55e; }
button.success:hover { background:#16a34a; }
button.danger { background:#ef4444; }
button.danger:hover { background:#dc2626; }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.row > * { flex:1; min-width:150px; }
.output-area { background:#0f172a; border-radius:8px; padding:14px; margin-top:12px; font-family:monospace; font-size:14px; white-space:pre-wrap; word-break:break-all; border:1px solid #334155; min-height:40px; color:#22c55e; }
.result { font-size:15px; color:#22c55e; font-weight:600; margin-top:8px; }
.copy-btn { cursor:pointer; background:#334155; padding:6px 12px; border-radius:6px; font-size:12px; color:#94a3b8; border:1px solid #475569; margin-top:8px; }
.copy-btn:hover { background:#475569; color:#e2e8f0; }
.footer { text-align:center; padding:24px 20px; border-top:1px solid #334155; margin-top:24px; }
.footer .addr { color:#a5b4fc; font-size:12px; cursor:pointer; }
.footer .addr:hover { color:#818cf8; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#22c55e; color:white; padding:10px 20px; border-radius:8px; font-size:14px; z-index:999; display:none; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>密码生成器</h1>
<div class="sub">生成高强度随机密码</div>
</div>

<div class="card">
  <div class="row">
    <div><label>密码长度</label><input type="number" id="len" value="16" min="4" max="128"></div>
    <div><label><input type="checkbox" id="sym" checked> 包含特殊字符</label></div>
  </div>
  <button onclick="generate()">生成密码</button>
  <label>生成的密码</label>
  <div class="output-area" id="output" style="font-size:18px;letter-spacing:2px;"></div>
  <button class="copy-btn" onclick="copyResult()">📋 复制密码</button>
</div>


<div class="footer">
  <div style="color:#475569;font-size:12px;margin-bottom:4px;">💖 如果这个工具有帮助，欢迎支持开发</div>
  <div class="addr" onclick="copyAddr()">USDT (TRC-20): TBzeBcdaEGvS2FLnW7wjHuN19RqUaVpFHH</div>
  <div style="color:#334155;font-size:11px;margin-top:8px;">工具集 · 开源免费</div>
</div>
<script>

  // ====== Payment System ======
  const payKey = '_pt_' + window.location.pathname.split('/').pop().replace(/\..*$/,'');
  let payVerified = localStorage.getItem(payKey) === 'true';
  
  // Intercept all button clicks for payment check
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.closest('.pay-overlay')) return;
    if (payVerified) return;
    
    e.preventDefault();
    e.stopPropagation();
    showPayWall();
  }, true);
  
  function showPayWall() {
    document.getElementById('payOverlay').style.display = 'flex';
  }
  
  window.copyPayAddr = function() {
    navigator.clipboard.writeText( + USDT_ADDR + );
    var el = document.querySelector('.addr-box code');
    var orig = el.textContent;
    el.textContent = '✅ 已复制';
    setTimeout(function(){ el.textContent = orig; }, 2000);
  };
  
  window.verifyPayment = function() {
    var tx = document.getElementById('txHash').value.trim();
    if (!tx || tx.length < 10) { alert('请输入有效的交易哈希'); return; }
    
    var btn = document.querySelector('.btn-pay');
    btn.disabled = true;
    btn.textContent = '⏳ 验证中...';
    
    // Verify via TronGrid API
    fetch('https://api.trongrid.io/v1/transactions/' + tx + '/trc20')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var trc20 = data && data.data && data.data[0];
        if (!trc20) {
          btn.disabled = false;
          btn.textContent = '✅ 验证并解锁';
          alert('❌ 未找到该交易，请确认交易哈希正确');
          return;
        }
        
        var toAddr = trc20.to_address_hex || '';
        var value = parseFloat(trc20.value) / 1000000;
        var ourAddr =  + USDT_ADDR + ;
        
        if (toAddr.toLowerCase().indexOf(ourAddr.toLowerCase().replace(/[A-Z]/g,function(m){return m.toLowerCase();})) >= 0 && value >= 1) {
          payVerified = true;
          localStorage.setItem(payKey, 'true');
          localStorage.setItem(payKey + '_tx', tx);
          document.getElementById('payOverlay').style.display = 'none';
          alert('✅ 支付验证通过！现在可以免费使用该工具');
        } else {
          btn.disabled = false;
          btn.textContent = '✅ 验证并解锁';
          alert('❌ 未检测到 $1 USDT 到账，请确认已转账到正确地址');
        }
      })
      .catch(function(err){
        console.error('Verification error:', err);
        btn.disabled = false;
        btn.textContent = '✅ 验证并解锁';
        alert('⚠️ 验证服务暂时不可用，请稍后再试');
      });
  };

</script></script>
<div class="toast" id="toast"></div>

</div>
<script>
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast') || (()=>{const e=document.createElement('div');e.className='toast';e.id='toast';document.body.appendChild(e);return e;
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.style.display='none',2000);
}

let lenInput, output;
function generate() {
  const len = parseInt(document.getElementById('len').value) || 16;
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const digits = '0123456789';
  const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
  let chars = lower + upper + digits;
  if (document.getElementById('sym').checked) chars += symbols;
  let pwd = '';
  const array = new Uint32Array(len);
  crypto.getRandomValues(array);
  for (let i = 0; i < len; i++) pwd += chars[array[i] % chars.length];
  document.getElementById('output').textContent = pwd;
}
function copyResult() { navigator.clipboard.writeText(document.getElementById('output').textContent); showToast('已复制'); }

</script>
