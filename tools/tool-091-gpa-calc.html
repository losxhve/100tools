<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GPA计算器 - 100 Tools</title><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;}
.container{max-width:720px;margin:0 auto;padding:24px 20px;flex:1;width:100%;}
.header{text-align:center;margin-bottom:24px;}
.header h1{font-size:24px;background:linear-gradient(135deg,#f59e0b,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.header .sub{color:#64748b;font-size:13px;}
.card{background:#1e293b;border-radius:12px;padding:24px;border:1px solid #334155;margin-bottom:16px;}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px;font-weight:600;}
textarea,input,select{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none;margin-bottom:12px;}
textarea:focus,input:focus,select:focus{border-color:#3b82f6;}
textarea{min-height:120px;resize:vertical;font-family:monospace;}
button{padding:10px 24px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:#3b82f6;color:white;transition:background.15s;margin-right:8px;margin-bottom:8px;}
button:hover{background:#2563eb;}
button.secondary{background:#334155;color:#e2e8f0;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.row>*{flex:1;min-width:150px;}
.output-area{background:#0f172a;border-radius:8px;padding:14px;margin-top:12px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all;border:1px solid #334155;min-height:40px;color:#22c55e;}
.footer{text-align:center;padding:24px 20px;border-top:1px solid #334155;margin-top:24px;}
.footer .addr{color:#a5b4fc;font-size:12px;cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22c55e;color:white;padding:10px 20px;border-radius:8px;z-index:999;display:none;}
</style></head><body><div class="container"><div class="header"><h1>GPA计算器</h1><div class="sub">计算学分绩点</div></div><div class='card'><label>输入课程（格式：学分,成绩）每行一门</label><textarea id='courses'>4,85\n3,92\n2,78\n3,88</textarea><button onclick='calcGPA()'>计算GPA</button><div class='output-area' id='output'></div></div><script>function calcGPA(){const lines=document.getElementById('courses').value.split('\n').filter(Boolean);let totalCredits=0,totalPoints=0;let html='<table style="width:100%;font-size:13px;"><tr style="color:#94a3b8;"><th style="padding:6px;text-align:left;">学分</th><th style="padding:6px;text-align:left;">成绩</th><th style="padding:6px;text-align:left;">绩点</th></tr>';lines.forEach(line=>{const[cred,score]=line.split(',').map(Number);if(isNaN(cred)||isNaN(score))return;let gp;if(score>=90)gp=4.0;else if(score>=85)gp=3.7;else if(score>=82)gp=3.3;else if(score>=78)gp=3.0;else if(score>=75)gp=2.7;else if(score>=72)gp=2.3;else if(score>=68)gp=2.0;else if(score>=64)gp=1.5;else if(score>=60)gp=1.0;else gp=0;totalCredits+=cred;totalPoints+=cred*gp;html+='<tr><td style="padding:4px;border-bottom:1px solid #1e293b;">'+cred+'</td><td style="padding:4px;border-bottom:1px solid #1e293b;">'+score+'</td><td style="padding:4px;border-bottom:1px solid #1e293b;">'+gp.toFixed(1)+'</td></tr>';});const gpa=totalPoints/totalCredits;html+='</table><div style="margin-top:12px;font-size:18px;">GPA: <strong style="color:#22c55e;">'+gpa.toFixed(3)+'</strong></div>';document.getElementById('output').innerHTML=html;}</script><div class="footer"><div style="color:#475569;font-size:12px;margin-bottom:4px;">💖 如果这个工具有帮助，欢迎支持开发</div><div class="addr" onclick="navigator.clipboard.writeText('TBzeBcdaEGvS2FLnW7wjHuN19RqUaVpFHH').then(()=>{const t=document.getElementById('toast');t.textContent='✅ 地址已复制';t.style.display='block';setTimeout(()=>t.style.display='none',2000);})">USDT (TRC-20): TBzeBcdaEGvS2FLnW7wjHuN19RqUaVpFHH</div></div><div class="toast" id="toast"></div></div></body></html>
